# Portage configuration for the zeo-bin release build, used through
#
#     PORTAGE_CONFIGROOT=zed-patches/release/configroot ebuild <zeo ebuild> compile install
#
# It replaces /etc/portage for that one build, for two reasons:
#
# - The host's make.conf targets -march=znver5 and APPENDS -C target-cpu=znver5 to
#   whatever RUSTFLAGS the environment carries, so exporting x86-64-v3 flags on the
#   command line is silently overridden: the last target-cpu wins. Measured
#   2026-10-01, when the first release build was compiling for znver5 under a
#   command line that asked for x86-64-v3.
# - A binary handed to third parties must be reproducible by them, which means the
#   configuration that produced it is versioned, not left in a host's /etc.
#
# x86-64-v3 = AVX2/FMA/BMI2, i.e. Haswell (2013) / Zen 1 and later. The ebuild's
# pkg_pretend() in zeo-bin turns a CPU below that into a clear message instead of
# a SIGILL.
COMMON_FLAGS="-march=x86-64-v3 -mtune=generic -O2 -pipe"
CFLAGS="${COMMON_FLAGS}"
CXXFLAGS="${COMMON_FLAGS}"
FCFLAGS="${COMMON_FLAGS}"
FFLAGS="${COMMON_FLAGS}"
RUSTFLAGS="-C target-cpu=x86-64-v3 -C link-arg=-fuse-ld=mold"
LDFLAGS="-Wl,-O1 -Wl,--as-needed"
MAKEOPTS="-j32 -l32"

# The build runs unprivileged (no root on the build host), so the features that
# need privilege to set up are off. network-sandbox is off for the same reason;
# cargo runs --offline from the vendored crate distfiles regardless.
FEATURES="-sandbox -usersandbox -userpriv -network-sandbox -ccache -distcc"

DISTDIR="/var/cache/distfiles"
ACCEPT_LICENSE="*"
LC_MESSAGES=C.utf8
